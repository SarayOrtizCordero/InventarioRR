<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventario · Panel</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="topbar-brand">
        <span class="brand-mark">IR</span>
        <h1>Inventario de Ropa</h1>
      </div>
      <div class="user-info">
        <span class="avatar" id="user-avatar"></span>
        <button id="logout-btn" class="btn-secondary btn-icon-text" title="Cerrar sesión">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Salir
        </button>
      </div>
    </div>
  </header>

  <main class="dashboard">
    <section class="panel toolbar-panel">
      <p class="section-label">Categorías</p>
      <div class="toolbar">
        <nav class="category-tabs" id="category-tabs">
          <!-- Pestañas de categoría generadas por JS -->
        </nav>
        <div class="toolbar-actions">
          <button id="open-history" class="btn-secondary btn-icon-text">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 16 14"/></svg>
            Historial
          </button>
          <button id="open-add-product" class="btn-primary btn-icon-text">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Añadir producto
          </button>
        </div>
      </div>
    </section>

    <section class="panel products-panel">
      <div class="panel-header">
        <h2 class="panel-title">
          <button id="back-to-models" class="back-btn hidden" title="Volver a modelos" aria-label="Volver a modelos">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          </button>
          <span id="products-panel-title">Productos</span>
          <span class="count-badge" id="products-count">0</span>
        </h2>
        <div class="variant-filters hidden" id="variant-filters">
          <select id="filter-color">
            <option value="">Todos los colores</option>
          </select>
          <select id="filter-size">
            <option value="">Todas las tallas</option>
          </select>
        </div>
      </div>
      <div id="products-grid" class="products-grid">
        <!-- Tarjetas de modelo o de producto generadas por JS -->
      </div>
    </section>
  </main>

  <!-- Modal: Añadir categoría -->
  <div id="add-category-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Añadir categoría</h2>
        <button type="button" class="modal-close" data-close-modal="add-category-modal" aria-label="Cerrar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>
        </button>
      </div>
      <form id="add-category-form">
        <label for="category-name">Nombre</label>
        <input type="text" id="category-name" required placeholder="Ej: Guantes">

        <div class="modal-buttons">
          <button type="button" class="btn-secondary" data-close-modal="add-category-modal">Cancelar</button>
          <button type="submit" class="btn-primary">Guardar categoría</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Añadir producto -->
  <div id="add-product-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Añadir producto</h2>
        <button type="button" class="modal-close" data-close-modal="add-product-modal" aria-label="Cerrar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>
        </button>
      </div>
      <form id="add-product-form">
        <label for="product-category">Categoría</label>
        <select id="product-category" required></select>

        <label for="product-model-select">Modelo</label>
        <select id="product-model-select" required></select>
        <input type="text" id="product-model-new" class="hidden" placeholder="Nombre del nuevo modelo">

        <div class="field-row">
          <div>
            <label for="product-size-select">Talla</label>
            <select id="product-size-select" required>
              <option value="S">S</option>
              <option value="M" selected>M</option>
              <option value="L">L</option>
              <option value="XL">XL</option>
              <option value="XXL">XXL</option>
              <option value="3XL">3XL</option>
              <option value="4XL">4XL</option>
              <option value="__new__">+ Nueva talla…</option>
            </select>
            <input type="text" id="product-size-new" class="hidden" placeholder="Ej: 42">
          </div>
          <div>
            <label for="product-quantity">Cantidad inicial</label>
            <input type="number" id="product-quantity" min="0" value="1" required>
          </div>
        </div>

        <label for="product-color-select">Color</label>
        <select id="product-color-select" required>
          <option value="" disabled selected>Selecciona un color</option>
          <option value="Amarillo">Amarillo</option>
          <option value="Amarillo Flúor">Amarillo Flúor</option>
          <option value="Arena Oscuro">Arena Oscuro</option>
          <option value="Azul Luz de Luna">Azul Luz de Luna</option>
          <option value="Blanco">Blanco</option>
          <option value="Celeste">Celeste</option>
          <option value="Coral">Coral</option>
          <option value="Flúor">Flúor</option>
          <option value="Gris">Gris</option>
          <option value="Gris Vigoré">Gris Vigoré</option>
          <option value="Lima">Lima</option>
          <option value="Marino">Marino</option>
          <option value="Marino/Amarillo Flúor">Marino/Amarillo Flúor</option>
          <option value="Marino/Naranja Flúor">Marino/Naranja Flúor</option>
          <option value="Morado">Morado</option>
          <option value="Naranja Flúor">Naranja Flúor</option>
          <option value="Negro">Negro</option>
          <option value="Plomo Oscuro">Plomo Oscuro</option>
          <option value="Plomo/Amarillo Flúor">Plomo/Amarillo Flúor</option>
          <option value="Rojo">Rojo</option>
          <option value="Rojo Laboral/Amarillo Flúor">Rojo Laboral/Amarillo Flúor</option>
          <option value="Rosa Flúor">Rosa Flúor</option>
          <option value="Rosa Lady Flúor">Rosa Lady Flúor</option>
          <option value="Rosetón">Rosetón</option>
          <option value="Royal">Royal</option>
          <option value="Turquesa">Turquesa</option>
          <option value="Verde Flúor">Verde Flúor</option>
          <option value="Verde Helecho">Verde Helecho</option>
          <option value="Verde Jardín/Amarillo Flúor">Verde Jardín/Amarillo Flúor</option>
          <option value="Verde Kelly">Verde Kelly</option>
          <option value="Verde Menta">Verde Menta</option>
          <option value="Verde Militar">Verde Militar</option>
          <option value="__new__">+ Nuevo color…</option>
        </select>
        <input type="text" id="product-color-new" class="hidden" placeholder="Nombre del nuevo color">

        <div class="modal-buttons">
          <button type="button" class="btn-secondary" data-close-modal="add-product-modal">Cancelar</button>
          <button type="submit" class="btn-primary">Guardar producto</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Ajustar stock -->
  <div id="stock-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="stock-modal-title">Ajustar stock</h2>
        <button type="button" class="modal-close" data-close-modal="stock-modal" aria-label="Cerrar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>
        </button>
      </div>
      <form id="stock-form">
        <input type="hidden" id="stock-product-id">
        <input type="hidden" id="stock-type">

        <label for="stock-quantity">Cantidad</label>
        <input type="number" id="stock-quantity" min="1" value="1" required>

        <label for="stock-note">Nota (opcional)</label>
        <input type="text" id="stock-note" placeholder="Ej: Reposición proveedor">

        <div class="modal-buttons">
          <button type="button" class="btn-secondary" data-close-modal="stock-modal">Cancelar</button>
          <button type="submit" class="btn-primary">Confirmar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Historial de movimientos -->
  <div id="history-modal" class="modal hidden">
    <div class="modal-content modal-wide">
      <div class="modal-header">
        <h2 id="history-modal-title">Historial de movimientos</h2>
        <button type="button" class="modal-close" data-close-modal="history-modal" aria-label="Cerrar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>
        </button>
      </div>
      <div class="history-filters" id="history-filters">
        <button type="button" class="history-filter-btn active" data-filter="all">Todos</button>
        <button type="button" class="history-filter-btn" data-filter="entrada">Entradas</button>
        <button type="button" class="history-filter-btn" data-filter="salida">Salidas</button>
      </div>
      <div id="history-list" class="history-list"></div>
      <div class="modal-buttons">
        <button type="button" class="btn-secondary" data-close-modal="history-modal">Cerrar</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/movements.js"></script>
  <script src="js/inventory.js"></script>
</body>
</html>
